services:
  - type: web
    name: kalpu-premium-store-v2
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: kalpu-store-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: UPI_ID
        sync: false
      - key: UPI_PAYEE_NAME
        value: Kalpu Store
      - key: STORE_NAME
        value: KALPU PREMIUM STORE
      - key: DB_PATH
        value: /var/data/store.db
      - key: SUPPORT_USERNAME
        sync: false
